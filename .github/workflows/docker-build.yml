name: Docker Build

on:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROJECT_NAME: specs_out

jobs:
  docker-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ${PROJECT_NAME}:latest -f docker/Dockerfile .

      - name: Test build inside container
        run: |
          docker run --rm ${PROJECT_NAME}:latest make a
